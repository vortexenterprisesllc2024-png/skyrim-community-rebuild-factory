# Builds Auto Plant Everything (Jo Hoeflich's own SKSE plugin, source in sources/auto-plant-everything/).
# Runs on every push to the auto-plant-everything branch that touches the source or this file.
# CommonLib comes in exactly as for the factory's OIF rebuild (ci/build-auto-plant-everything.ps1).
# The finished DLL and Vortex/Nexus zip are committed back to this branch under releases/auto-plant-everything/.
name: Build Auto Plant Everything

on:
  push:
    branches: [auto-plant-everything]
    paths:
      - "sources/auto-plant-everything/**"
      - "ci/build-auto-plant-everything.ps1"
      - ".github/workflows/auto-plant-everything.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-plant-everything
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bincache-auto-plant-everything-${{ hashFiles('ci/build-auto-plant-everything.ps1', 'ci/common.ps1') }}
          restore-keys: vcpkg-bincache-auto-plant-everything-

      - name: Build (CommonLibSSE-NG 8 via OIF overlay port, same as the factory's OIF rebuild)
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
          VCPKG_FEATURE_FLAGS: manifests,binarycaching
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          .\ci\build-auto-plant-everything.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: auto-plant-everything
          path: releases/auto-plant-everything/
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: auto-plant-everything
          path: releases/auto-plant-everything/
      - name: Commit build outputs
        shell: bash
        run: |
          set -e
          git config user.name "rebuild-factory[bot]"
          git config user.email "vortexenterprisesllc2024+factory@users.noreply.github.com"
          git add -A releases/auto-plant-everything
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "releases/auto-plant-everything: build outputs (run ${{ github.run_id }})"
          for i in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            git pull --rebase origin ${{ github.ref_name }}
          done
          git push origin HEAD:${{ github.ref_name }}
