# AdventureXP 4.0.0 factory wrapper.
# Private repo vortexenterprisesllc2024-png/AdventureXP could not be created
# (GitHub App token lacks createRepository). Source lives at mods/AdventureXP/.
# GitHub only loads workflows from the repo-root .github/workflows/, so this
# file sets working-directory and artifact paths accordingly.
name: build

on:
  push:
    paths:
      - "mods/AdventureXP/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "mods/AdventureXP/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: adventurexp-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (math, ESL, zip layout)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/AdventureXP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure host tests
        run: cmake --preset host-tests
      - name: Build and run math tests
        run: |
          cmake --build --preset host-tests
          ctest --preset host-tests --output-on-failure
      - name: Generate ESL and validate pack layout
        run: |
          python3 scripts/generate_esl.py
          python3 tests/test_esl.py
          python3 tests/test_pack_layout.py
          python3 scripts/assert-cleanroom.py

  windows-msvc:
    name: Windows MSVC AdventureXP.dll
    # Factory note: windows-latest is VS 2026 (no VS 2022 instance).
    # CommonLibSSE-NG / MSVC static runtime builds use windows-2022.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: mods/AdventureXP
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      VCPKG_FEATURE_FLAGS: manifests,versions,binarycaching
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        working-directory: ${{ github.workspace }}
        run: choco install ninja -y

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\vcpkg-bincache
          key: vcpkg-bincache-adventurexp-${{ hashFiles('mods/AdventureXP/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-adventurexp-

      - name: Clone vcpkg
        working-directory: ${{ github.workspace }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          git -C C:\vcpkg fetch --depth 1 origin ee12231b20c95013c6638d845d04c91559a1d1ff
          git -C C:\vcpkg checkout ee12231b20c95013c6638d845d04c91559a1d1ff
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset windows-msvc-release

      - name: Build
        run: cmake --build --preset windows-msvc-release --parallel

      - name: Pack Vortex zip
        run: |
          python scripts/generate_esl.py
          python scripts/pack.py --source

      - name: Confirm AdventureXP.dll in layout zip
        run: |
          python -c "import zipfile; names=zipfile.ZipFile('dist/packed/AdventureXP-4.0.0.zip').namelist(); print('\n'.join(names)); assert 'SKSE/Plugins/AdventureXP.dll' in names, names"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdventureXP-4.0.0
          path: |
            mods/AdventureXP/dist/packed/AdventureXP-4.0.0.zip
            mods/AdventureXP/dist/packed/AdventureXP-4.0.0-SOURCE.zip
          if-no-files-found: error
