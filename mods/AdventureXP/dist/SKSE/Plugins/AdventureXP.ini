[Optional]
fKillXP=2.0
fBossKillXP=25.0
; Reading XP = floor(sqrt(goldValue) * fReadingMult); then * (readingWeight/100); ignores global.
; Notes/letters with gold 0 stay 0 XP. Examples at 1.0: Sparks 69 → ~8; Turn Lesser Undead 240 → ~15; Repel Undead 1769 → ~42.
fReadingMult=1.0
; Legacy unused. Reading awards use the sqrt(gold) * fReadingMult formula, not this flat value.
fReadingXP=5.0
fCraftingXP=8.0
; Skill-up XP = fSkillUpXP * max(1, skillLevel) / max(1, fSkillUpLevelScale)
; then * (per-skill/100) * (fSkillUpWeight/100); ignores global.
; Default scale 10 with fSkillUpXP=4 @100%/100%: skill10=+4, 29=~+12, 50=+20, 100=+40.
fSkillUpXP=4.0
fSkillUpLevelScale=10.0

[Flavor]
; Extra % on matching kills. Packs set these; leave 0 for a straight slider mix.
fUndeadCombatBonus=0.0
fStealthCombatBonus=0.0
fBeastCombatBonus=0.0

