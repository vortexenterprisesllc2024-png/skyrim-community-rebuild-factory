; AdventureXP 4.0.0 — INI config (working title; public name TBD)
; All-new clean-room plugin. Inspired by EverQuest-style leveling and other games.
; SkyUI MCM is phase 2; it will call the same ApplyPreset() packs as sPreset below.

[General]
bEnabled=1
fGlobalXPPercent=100.0
bShowXPMessages=1
; Zero vanilla fXPPerSkillRank. Packs that want training XP use our skill-up slider.
bIgnoreSkillLeveling=1
; One-click play-style. Names (case-insensitive):
;   Adventurer, Vigilant, Summoner, Thief, Assassin, Paladin,
;   Warrior, Mage, Ranger, Bard, Merchant, Necromancer,
;   Beastblood, Spellsword, Monk
; Custom = do not apply a pack; use [Weights] / [Flavor] only.
sPreset=Adventurer

[Weights]
; 100 = the base XP in the sections below. 0 turns that source off.
; A pack writes these sliders; you can tweak them afterward.
fQuestWeight=100.0
fDiscoveryWeight=100.0
fClearWeight=100.0
fCombatWeight=0.0
fReadingWeight=0.0
fCraftingWeight=0.0
fSkillUpWeight=0.0

[Quests]
bAwardQuestStages=1
bAwardQuestComplete=1
bSkipHiddenQuests=1
bSkipMiscQuests=0
fQuestStageXP=12.0
fQuestCompleteXP=80.0
fMainQuestMultiplier=1.5

[Exploration]
fDiscoveryXP=30.0
fDungeonClearXP=100.0

[Optional]
fKillXP=2.0
fBossKillXP=25.0
fReadingXP=5.0
fCraftingXP=8.0
fSkillUpXP=4.0

[QuestTypes]
; Extra scale by stock quest type (100 = no change). Independent of any other mod's keys.
fMain=100.0
fGuild=100.0
fDaedric=100.0
fSide=100.0
fMisc=100.0
fCivilWar=100.0
fDLC=100.0
fOther=100.0

[PlaceTypes]
; Extra scale by vanilla location keywords (discover + clear).
fDefault=100.0
fCity=100.0
fDungeon=100.0
fCave=100.0
fNordic=100.0
fDwemer=100.0
fFort=100.0
fCamp=100.0
fDragonLair=100.0
fMine=100.0

[Flavor]
; Extra % on matching kills. Packs set these; leave 0 for a straight slider mix.
fUndeadCombatBonus=0.0
fStealthCombatBonus=0.0
fBeastCombatBonus=0.0

[Leveling]
fXPBase=200.0
fXPPerLevel=50.0
fXPExponent=1.0
iMaxLevel=81
