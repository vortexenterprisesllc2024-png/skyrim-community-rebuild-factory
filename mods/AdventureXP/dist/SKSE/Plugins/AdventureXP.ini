; AdventureXP 4.2.11 — INI config (plugin files: AdventureXP.*)
; All-new clean-room plugin. Inspired by EverQuest-style leveling and other games.
; SkyUI MCM (AdventureXPMCM) writes these keys through natives; no reload needed.

[General]
bEnabled=1
; Reserved. Awards ignore fGlobalXPPercent; use the XP Sources sliders.
fGlobalXPPercent=100.0
bShowXPMessages=1
; Zero vanilla fXPPerSkillRank. Packs that want training XP use our skill-up slider.
bIgnoreSkillLeveling=1
; Killing / reading gates. Category sliders still scale the award when these are on.
bAwardKilling=0
bAwardReading=0
; One-click play-style. Names (case-insensitive):
;   Adventurer, Vigilant, Summoner (shows as Conjurer), Thief, Assassin, Paladin,
;   Warrior, Mage, Ranger, Bard, Merchant, Necromancer (shows as Summoner),
;   Beastblood, Spellsword, Monk, Illusionist, elementalist, Battlemage, Crafter, Wizard
; Custom = do not apply a pack; use the sliders as written.
sPreset=Adventurer

[Weights]
; Master scales, 0–100. 100 = use the absolute XP amounts below as-is.
fQuestWeight=100.0
fDiscoveryWeight=100.0
fClearWeight=100.0
fCombatWeight=0.0
fReadingWeight=0.0
fCraftingWeight=0.0
fSkillUpWeight=0.0

[Quests]
; Stages stay ON. Every XP Sources slider ignores fGlobalXPPercent (weight only).
bAwardQuestStages=1
bAwardQuestComplete=1
; 0 = only journal-visible stage / objective advances (4.2.11 default).
; 1 = 4.2.10: every TESQuestStageEvent with stage != 0, once per formID+stage.
bAwardSilentQuestStages=0
bSkipHiddenQuests=1
bSkipMiscQuests=0
fMainQuestMultiplier=1.0

