# Auto Plant Everything 1.0.0 - settings
# Edit with Notepad. 1 = on, 0 = off. Takes effect the next time you start the game.
# Results are written to Documents\My Games\Skyrim Special Edition\SKSE\AutoPlantEverything.log

[General]
# Master switch. 0 turns the whole mod off without uninstalling it.
bEnabled=1

[Scanning]
# Make everything that gives an ingredient when harvested plantable:
# herbs, crops, mushrooms, eggs from nests, hanging moss, honeycomb and more.
bScanHarvest=1

# Also allow harvested food items (food crops like corn, grapes, cabbage).
bIncludeFood=1

# Use the planter lists other mods ship (for example Beyond Skyrim's) first,
# so their purpose-built planter plants are used instead of wild ones.
bMergeModPlanterLists=1

# Skip leftover developer test records (EditorIDs starting with "Test").
bSkipTestRecords=1

[Filters]
# Harvestables whose model path contains any of these words are never planted.
# Defaults keep out hanging carcasses, bottles, wall trophies, bones, fish effects,
# mead barrels, skewers, hagraven clutter, buckets, wall baskets and horker meat. Delete a word to allow it.
ExcludeModelKeywords=deadanimals, \bottles\, winebottle, mounted, \bones\, effects\, meadery, skewer, hagraven, bucket, wallbasket, horkermeat

# Comma-separated EditorIDs (plant or item) to never make plantable.
# Needs powerofthree's Tweaks so EditorIDs are available in game.
# Example: Blacklist=TestTreeFloraMountainFlower01Blue, SomeQuestPlant01
Blacklist=
