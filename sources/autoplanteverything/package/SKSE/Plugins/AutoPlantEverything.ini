# Auto Plant Everything - settings
# Edit with Notepad. 1 = on, 0 = off. Takes effect next time you start the game.

[General]
# Master switch. 0 turns the whole mod off without uninstalling it.
bEnabled=1

[Scanning]
# Find plants that drop an ingredient when harvested, and make that ingredient
# plantable. This is the whole mod; leaving it off means it does nothing.
bScanHarvest=1

# Skip ingredients already in the planter list, so nothing gets added twice.
bSkipDuplicates=1

# Skip leftover developer test records (EditorIDs starting with "Test").
bSkipTestRecords=1

[Safety]
# Comma-separated EditorIDs to never make plantable. If some plant shows up in a
# planter that shouldn't be there, put its name here and it's gone next load.
# Example: Blacklist=TestTreeFloraMountainFlower01Blue, SomeQuestPlant01
Blacklist=
